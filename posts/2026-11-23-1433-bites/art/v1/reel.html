<style>
/* A custom CRM as the questions only one trade asks. Five scenes, one world: butter yellow, ink, raised white.
   Each scene is one form control at enormous scale, and it works: a three-way choice (Bites?), a stepper (Tiers?),
   a switch (Piano?), a picker wheel that lands on Yours?, then one ink button. Recessed trays, raised white parts,
   light from above. Fraunces 600 for every question, Geist for the interface. One margin (72px).
   The controls are interface (data-ui); real word counts: 6, 5, 5, 11 (4.0s), 12. */
.scene{overflow:hidden;visibility:hidden;color:#17150F;
  background:radial-gradient(1500px 1300px at 18% 12%,#F9DB5C 0%,#F4CF3F 55%,#EDC433 100%);
  animation:nxIn .01s linear var(--t0) both,nxOut .01s linear var(--t1) forwards,sv calc(var(--t1) - var(--t0) + .02s) linear var(--t0)}
@keyframes sv{0%,100%{visibility:visible}}
.cam{position:absolute;inset:0;transform-origin:540px 900px;animation:push var(--len) linear var(--t0) both}
@keyframes push{from{transform:scale(1)}to{transform:scale(1)}}
.k{position:absolute;left:76px;top:252px;font:600 46px/1 Geist;letter-spacing:-.012em;color:#17150F}
.q{position:absolute;left:68px;top:346px;font:600 288px/1 Fraun;letter-spacing:-.03em;white-space:nowrap}
.tray{position:absolute;left:72px;width:936px;background:#DDB42A;
  box-shadow:inset 0 10px 18px rgba(96,66,0,.38),inset 0 2px 3px rgba(70,46,0,.45),inset 0 -3px 0 rgba(255,244,190,.55),0 3px 0 rgba(255,240,170,.55)}
.raised{background:linear-gradient(#FFFFFF,#FBF6E6);
  box-shadow:inset 0 3px 0 #fff,inset 0 -5px 0 rgba(120,92,10,.10),0 0 0 2px rgba(84,58,0,.30),0 3px 4px rgba(70,46,0,.45),0 16px 26px rgba(80,54,0,.30),0 40px 60px -18px rgba(80,54,0,.34)}
.t0{animation-delay:calc(var(--t0) + var(--d,0s))!important}

.dish:after{content:'';position:absolute;inset:9%;border-radius:50%;background:linear-gradient(#F0E9D3,#FFFFFF 85%);box-shadow:inset 0 3px 5px rgba(90,64,0,.16)}
.dish svg{z-index:2}
/* 1: three-way choice */
.seg{top:742px;height:740px;border-radius:78px}
.seg .thumb{position:absolute;left:16px;top:16px;width:904px;height:236px;border-radius:62px;
  animation:seg1 .62s cubic-bezier(.3,1.45,.45,1) calc(var(--t0) + 1.25s) both}
@keyframes seg1{from{transform:translateY(0)}to{transform:translateY(236px)}}
.seg .row{position:absolute;left:78px;height:236px;font:600 118px/232px Geist;letter-spacing:-.035em}
.seg .a{top:16px;animation:dim .3s linear calc(var(--t0) + 1.3s) both}
.seg .b{top:252px;animation:lit .3s linear calc(var(--t0) + 1.45s) both}
.seg .c{top:488px;color:rgba(23,21,15,.5)}
@keyframes dim{from{color:#17150F}to{color:rgba(23,21,15,.5)}}
@keyframes lit{from{color:rgba(23,21,15,.5)}to{color:#17150F}}
.seg svg{position:absolute;right:66px;top:16px;width:120px;height:236px;animation:seg1 .62s cubic-bezier(.3,1.45,.45,1) calc(var(--t0) + 1.25s) both}

/* 2: stepper */
.step{top:796px;height:540px;border-radius:270px}
.step .btn{position:absolute;border-radius:50%}
.step .btn svg{position:absolute;inset:0;width:100%;height:100%}
.step .minus{left:36px;width:270px;height:270px;top:135px}
.step .plus{right:36px;width:270px;height:270px;top:135px;animation:press .28s ease-out calc(var(--t0) + .85s) both,press2 .28s ease-out calc(var(--t0) + 1.55s) both}
@keyframes press{0%{transform:scale(1)}40%{transform:scale(.93)}100%{transform:scale(1)}}
@keyframes press2{0%{transform:scale(1)}40%{transform:scale(.93)}100%{transform:scale(1)}}
.step .win{position:absolute;left:306px;width:324px;top:0;height:540px;overflow:hidden;text-align:center}
.step .col{animation:roll1 .45s cubic-bezier(.3,1.3,.5,1) calc(var(--t0) + .9s) both,roll2 .45s cubic-bezier(.3,1.3,.5,1) calc(var(--t0) + 1.6s) both}
.step .col div{height:540px;font:600 436px/528px Fraun;letter-spacing:-.02em}
@keyframes roll1{from{translate:0 0}to{translate:0 -540px}}
@keyframes roll2{from{transform:translateY(0)}to{transform:translateY(-540px)}}

/* 3: switch */
.sw{top:826px;height:480px;border-radius:240px;animation:swon .35s linear calc(var(--t0) + 1.05s) both}
@keyframes swon{to{background:#1B1913;box-shadow:inset 0 10px 18px rgba(0,0,0,.6),inset 0 2px 3px rgba(0,0,0,.6),inset 0 -3px 0 rgba(255,255,255,.10),0 3px 0 rgba(255,240,170,.55)}}
.sw .knob{position:absolute;left:24px;top:24px;width:432px;height:432px;border-radius:50%;
  animation:swk .6s cubic-bezier(.3,1.4,.45,1) calc(var(--t0) + 1s) both}
@keyframes swk{from{transform:translateX(0)}to{transform:translateX(456px)}}
.sw .no,.sw .yes{position:absolute;top:0;font:600 168px/470px Geist;letter-spacing:-.04em}
.sw .no{right:118px;color:rgba(23,21,15,.5);animation:nxOut .2s linear calc(var(--t0) + 1.05s) both}
.sw .yes{left:104px;color:#F6D447;opacity:0;animation:nxIn .25s linear calc(var(--t0) + 1.3s) both}

/* 4: picker */
.h4{position:absolute;left:71px;top:250px;font:600 136px/1.02 Fraun;letter-spacing:-.03em;white-space:nowrap}
.bar{position:absolute;left:72px;top:900px;width:936px;height:270px;border-radius:78px}
.wheel{position:absolute;left:0;top:630px;width:1080px;height:810px;overflow:hidden;
  -webkit-mask-image:linear-gradient(transparent 2%,#000 30%,#000 70%,transparent 98%);mask-image:linear-gradient(transparent 2%,#000 30%,#000 70%,transparent 98%)}
.wheel .col{position:absolute;left:138px;top:270px;animation:spin 1.9s cubic-bezier(.2,.7,.2,1) calc(var(--t0) + .5s) both}
.wheel .col div{height:270px;font:600 178px/262px Fraun;letter-spacing:-.03em;white-space:nowrap;color:rgba(23,21,15,.42)}
.wheel .col div.me{color:#17150F}
@keyframes spin{from{transform:translateY(-270px)}to{transform:translateY(-1080px)}}

/* 5: the button */
.logo5{position:absolute;left:76px;top:250px}.logo5 .nx-logo{height:60px}
.h5{position:absolute;left:71px;top:376px;font:600 136px/1.02 Fraun;letter-spacing:-.03em;white-space:nowrap}
.h5 span{display:block}
.go{position:absolute;left:72px;top:960px;width:936px;height:400px;border-radius:200px;
  background:linear-gradient(#2B2820,#15130E);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.16),inset 0 -6px 0 rgba(0,0,0,.5),0 3px 4px rgba(50,32,0,.55),0 18px 28px rgba(70,46,0,.36),0 46px 70px -18px rgba(70,46,0,.42);
  animation:go5 .5s cubic-bezier(.3,0,.3,1) calc(var(--t0) + 2.9s) both}
@keyframes go5{0%{transform:scale(1)}38%{transform:scale(.955) translateY(6px);box-shadow:inset 0 3px 0 rgba(255,255,255,.10),inset 0 -6px 0 rgba(0,0,0,.5),0 2px 3px rgba(50,32,0,.6),0 6px 10px rgba(70,46,0,.4),0 12px 20px -8px rgba(70,46,0,.4)}100%{transform:scale(1)}}
.go b{position:absolute;left:84px;top:84px;font:600 132px/1 Geist;letter-spacing:-.04em;color:#F6D447;white-space:nowrap}
.go i{position:absolute;left:88px;top:238px;font:500 64px/1 Geist;font-style:normal;letter-spacing:-.02em;color:#FFFDF4;white-space:nowrap}
</style>

<section class="scene s1" data-dur="3.4"><div class="cam" style="--len:3.4s">
  <div class="k">A dog groomer’s CRM asks</div>
  <div class="q">Bites?</div>
  <div class="tray seg" data-ui>
    <div class="thumb raised"></div>
    <div class="row a">No</div><div class="row b">Sometimes</div><div class="row c">Yes</div>
    <svg viewBox="0 0 120 236"><path d="M22 120 L52 150 L100 90" fill="none" stroke="#17150F" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div></div></section>

<section class="scene s2" data-dur="3.0"><div class="cam" style="--len:3s">
  <div class="k up" style="--d:0s">A cake maker’s CRM asks</div>
  <div class="q up" style="--d:.05s">Tiers?</div>
  <div class="tray step" data-ui>
    <div class="btn minus raised dish"><svg viewBox="0 0 250 250"><path d="M78 125H172" stroke="#17150F" stroke-width="17" stroke-linecap="round"/></svg></div>
    <div class="win"><div class="col"><div>1</div><div>2</div><div>3</div></div></div>
    <div class="btn plus raised dish"><svg viewBox="0 0 250 250"><path d="M78 125H172M125 78V172" stroke="#17150F" stroke-width="17" stroke-linecap="round"/></svg></div>
  </div></div></section>

<section class="scene s3" data-dur="3.0"><div class="cam" style="--len:3s">
  <div class="k up" style="--d:0s">A removal firm’s CRM asks</div>
  <div class="q up" style="--d:.05s">Piano?</div>
  <div class="tray sw" data-ui>
    <div class="no">No</div><div class="yes">Yes</div>
    <div class="knob raised dish"></div>
  </div></div></section>

<section class="scene s4" data-dur="4.0"><div class="cam" style="--len:4s">
  <div class="h4 up" style="--d:0s">Every business<br>has its own.</div>
  <div class="bar raised"></div>
  <div class="wheel" data-ui><div class="col">
    <div>Skip size?</div><div>Flue type?</div><div>Storeys?</div><div>Nut-free?</div><div class="me">Yours?</div><div>Sea view?</div><div>Gel nails?</div>
  </div></div></div></section>

<section class="scene s5" data-dur="4.8"><div class="cam" style="--len:4.8s">
  <div class="logo5"><!--logo:#17150F,#17150F--></div>
  <div class="h5"><span class="up" style="--d:0s">We build</span><span class="up" style="--d:.12s">the CRM that</span><span class="up" style="--d:.24s">asks yours.</span></div>
  <div class="go up" style="--d:.7s"><b>Book a call</b><i>at nexulabs.co.uk</i></div>
</div></section>
<!--grain:0.045-->
