<style>
/* A custom CRM as the questions only one trade asks. Five scenes, one world: butter yellow, ink, raised white.
   Each scene is a small line, one giant serif question and one form control at enormous scale, and the control works:
   a three-way choice (Bites?), a stepper (Tiers?), a switch (Piano?), a picker wheel that stops on an empty field (Yours?),
   then one ink button that presses in. One system: a recessed tray 936 wide from x 72 and y 790, raised parts inset 16px,
   light from above. Fraunces 600 for every question (288px; the payoff 232px on two lines), Geist for the interface.
   The three questions are data-bleed because their line box starts left of 64px; the ink was measured (tools/ink): 68 to 75px.
   The controls are interface (data-ui); real word counts: 6, 6, 6, 6 (plus the wheel), 8. Round 1 (reviewed 6.5) is in art/v1. */
.scene{overflow:hidden;visibility:hidden;color:#17150F;
  background:radial-gradient(1500px 1300px at 18% 12%,#F9DB5C 0%,#F4CF3F 55%,#EDC433 100%);
  animation:nxIn .01s linear var(--t0) both,nxOut .01s linear var(--t1) forwards,sv calc(var(--t1) - var(--t0) + .02s) linear var(--t0)}
@keyframes sv{0%,100%{visibility:visible}}
.k{position:absolute;left:71px;top:252px;font:600 46px/1 Geist;letter-spacing:-.012em;color:#17150F;white-space:nowrap}
.q{position:absolute;left:57px;top:346px;font:600 288px/1 Fraun;letter-spacing:-.03em;white-space:nowrap}
.tray{position:absolute;left:72px;top:790px;width:936px;height:680px;border-radius:78px;background:#DDB42A;
  box-shadow:inset 0 10px 18px rgba(96,66,0,.38),inset 0 2px 3px rgba(70,46,0,.45),inset 0 -3px 0 rgba(255,244,190,.55),0 3px 0 rgba(255,240,170,.55)}
.raised{background:linear-gradient(#FFFFFF,#FBF6E6);
  box-shadow:inset 0 3px 0 #fff,inset 0 -5px 0 rgba(120,92,10,.10),0 0 0 2px rgba(84,58,0,.30),0 3px 4px rgba(70,46,0,.45),0 16px 26px rgba(80,54,0,.30),0 40px 60px -18px rgba(80,54,0,.34)}
.dish:after{content:'';position:absolute;inset:9%;border-radius:50%;background:linear-gradient(#F0E9D3,#FFFFFF 85%);box-shadow:inset 0 3px 5px rgba(90,64,0,.16)}
.dish svg{position:absolute;inset:0;width:100%;height:100%;z-index:2}
.off{color:rgba(23,21,15,.66)}

/* 1: three-way choice */
.seg .thumb{position:absolute;left:16px;top:16px;width:904px;height:216px;border-radius:62px;
  animation:seg1 .62s cubic-bezier(.3,1.45,.45,1) calc(var(--t0) + 1.25s) both}
@keyframes seg1{from{transform:translateY(0)}to{transform:translateY(216px)}}
.seg .row{position:absolute;left:80px;height:216px;font:600 112px/212px Geist;letter-spacing:-.035em}
.seg .a{top:16px;animation:dim .3s linear calc(var(--t0) + 1.3s) both}
.seg .b{top:232px;animation:lit .3s linear calc(var(--t0) + 1.45s) both}
.seg .c{top:448px;left:86px;color:rgba(23,21,15,.66)}
@keyframes dim{from{color:#17150F}to{color:rgba(23,21,15,.66)}}
@keyframes lit{from{color:rgba(23,21,15,.66)}to{color:#17150F}}
.seg svg{position:absolute;right:76px;top:16px;width:96px;height:216px;animation:seg1 .62s cubic-bezier(.3,1.45,.45,1) calc(var(--t0) + 1.25s) both}

/* 2: stepper */
.step .win{position:absolute;left:0;width:936px;top:16px;height:432px;overflow:hidden;text-align:center}
.step .col{animation:roll1 .45s cubic-bezier(.3,1.3,.5,1) calc(var(--t0) + .9s) both,roll2 .45s cubic-bezier(.3,1.3,.5,1) calc(var(--t0) + 1.6s) both}
.step .col div{height:432px;font:600 430px/420px Fraun;letter-spacing:-.02em}
@keyframes roll1{from{translate:0 0}to{translate:0 -432px}}
@keyframes roll2{from{transform:translateY(0)}to{transform:translateY(-432px)}}
.step .btn{position:absolute;top:448px;width:444px;height:216px;border-radius:62px}
.step .btn svg{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px}
.step .minus{left:16px}
.step .plus{left:476px;animation:press .28s ease-out calc(var(--t0) + .85s) both,press2 .28s ease-out calc(var(--t0) + 1.55s) both}
@keyframes press{0%{transform:scale(1)}40%{transform:scale(.95) translateY(5px)}100%{transform:scale(1)}}
@keyframes press2{0%{transform:scale(1)}40%{transform:scale(.95) translateY(5px)}100%{transform:scale(1)}}

/* 3: switch */
.sw{height:560px;border-radius:280px;animation:swon .35s linear calc(var(--t0) + 1.05s) both}
@keyframes swon{to{background:#1B1913;box-shadow:inset 0 10px 18px rgba(0,0,0,.6),inset 0 2px 3px rgba(0,0,0,.6),inset 0 -3px 0 rgba(255,255,255,.10),0 3px 0 rgba(255,240,170,.55)}}
.sw .knob{position:absolute;left:16px;top:16px;width:528px;height:528px;border-radius:50%;
  animation:swk .6s cubic-bezier(.3,1.4,.45,1) calc(var(--t0) + 1s) both}
@keyframes swk{from{transform:translateX(0)}to{transform:translateX(376px)}}
.sw .no,.sw .yes{position:absolute;top:0;width:376px;text-align:center;font:600 160px/548px Geist;letter-spacing:-.04em}
.sw .no{right:20px;color:rgba(23,21,15,.66);animation:nxOut .2s linear calc(var(--t0) + 1.05s) both}
.sw .yes{left:22px;color:#F6D447;opacity:0;animation:nxIn .25s linear calc(var(--t0) + 1.3s) both}

/* 4: picker wheel */
.pick{overflow:hidden;perspective:2600px;perspective-origin:50% 50%}
.pick .thumb{position:absolute;left:16px;top:232px;width:904px;height:216px;border-radius:62px}
.pick .drum{position:absolute;left:0;top:232px;width:936px;height:216px;transform-style:preserve-3d;
  animation:spin 1.9s cubic-bezier(.2,.7,.15,1) calc(var(--t0) + .45s) both}
@keyframes spin{from{transform:translateZ(-433px) rotateX(28deg)}to{transform:translateZ(-433px) rotateX(112deg)}}
.pick .drum div{position:absolute;left:80px;top:0;height:216px;width:800px;font:600 118px/206px Fraun;letter-spacing:-.025em;white-space:nowrap;
  backface-visibility:hidden;transform-origin:50% 50%;color:rgba(23,21,15,.66)}
.pick .ph{color:rgba(23,21,15,.38);font-size:104px!important}
.pick .ph:before{content:'';display:inline-block;width:9px;height:124px;margin-right:14px;vertical-align:-24px;border-radius:4px;background:#17150F;
  animation:blink 1.1s steps(1) calc(var(--t0) + 2.9s) infinite}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
.pick .shade{position:absolute;inset:0;border-radius:78px;pointer-events:none;
  background:linear-gradient(#D2A823 0,#D2A823 8%,rgba(221,180,42,0) 13%,rgba(221,180,42,0) 87%,#D2A823 92%,#D2A823 100%);
  box-shadow:inset 0 10px 18px rgba(96,66,0,.38),inset 0 2px 3px rgba(70,46,0,.45),inset 0 -3px 0 rgba(255,244,190,.55)}

/* 5: the button */
.k5{position:absolute;left:72px;top:246px}.k5 .nx-logo{height:54px}
.q5{position:absolute;left:67px;top:356px;font:600 232px/.9 Fraun;letter-spacing:-.03em;white-space:nowrap}
.cta{top:884px;height:600px}
.go{position:absolute;left:16px;top:16px;width:904px;height:568px;border-radius:62px;
  background:linear-gradient(#2D2A21,#15130E);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.16),inset 0 -6px 0 rgba(0,0,0,.5),0 0 0 2px rgba(40,26,0,.5),0 4px 5px rgba(50,32,0,.55),0 18px 28px rgba(70,46,0,.40),0 44px 60px -18px rgba(70,46,0,.45);
  animation:go5 .7s cubic-bezier(.3,0,.3,1) calc(var(--t0) + 2.6s) both}
@keyframes go5{0%{transform:none}30%,55%{transform:scale(.972) translateY(7px);box-shadow:inset 0 3px 0 rgba(255,255,255,.10),inset 0 -6px 0 rgba(0,0,0,.5),0 0 0 2px rgba(40,26,0,.5),0 2px 3px rgba(50,32,0,.6),0 5px 8px rgba(70,46,0,.4),0 8px 12px -6px rgba(70,46,0,.4)}100%{transform:none}}
.go b{position:absolute;left:66px;top:74px;font:600 150px/1 Geist;letter-spacing:-.045em;color:#F6D447;white-space:nowrap}
.go i{position:absolute;left:72px;top:262px;font:500 78px/1 Geist;font-style:normal;letter-spacing:-.025em;color:#FFFDF4;white-space:nowrap}
.go .disc{position:absolute;right:56px;bottom:56px;width:150px;height:150px;border-radius:50%;background:linear-gradient(#FFFFFF,#F6F0DD);
  box-shadow:inset 0 3px 0 #fff,0 3px 5px rgba(0,0,0,.6),0 12px 20px rgba(0,0,0,.45)}
.go .disc svg{position:absolute;inset:0;width:100%;height:100%}
</style>

<section class="scene s1" data-dur="3.4">
  <div class="k">A dog groomer’s CRM asks</div>
  <div class="q" data-bleed>Bites?</div>
  <div class="tray seg" data-ui>
    <div class="thumb raised"></div>
    <div class="row a">No</div><div class="row b">Sometimes</div><div class="row c">Yes</div>
    <svg viewBox="0 0 96 216"><path d="M10 110 L38 138 L86 78" fill="none" stroke="#17150F" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div></section>

<section class="scene s2" data-dur="3.0">
  <div class="k up" style="--d:0s">A cake maker’s CRM asks</div>
  <div class="q up" data-bleed style="--d:.05s;left:62px">Tiers?</div>
  <div class="tray step" data-ui>
    <div class="win"><div class="col"><div>1</div><div>2</div><div>3</div></div></div>
    <div class="btn minus raised"><svg viewBox="0 0 120 120"><path d="M14 60H106" stroke="#17150F" stroke-width="17" stroke-linecap="round"/></svg></div>
    <div class="btn plus raised"><svg viewBox="0 0 120 120"><path d="M14 60H106M60 14V106" stroke="#17150F" stroke-width="17" stroke-linecap="round"/></svg></div>
  </div></section>

<section class="scene s3" data-dur="3.0">
  <div class="k up" style="--d:0s">A removal firm’s CRM asks</div>
  <div class="q up" data-bleed style="--d:.05s">Piano?</div>
  <div class="tray sw" data-ui>
    <div class="no">No</div><div class="yes">Yes</div>
    <div class="knob raised dish"></div>
  </div></section>

<section class="scene s4" data-dur="3.8">
  <div class="k up" style="--d:0s;left:68px">Every business has its own</div>
  <div class="q up" style="--d:.05s;left:64px">Yours?</div>
  <div class="tray pick" data-ui>
    <div class="thumb raised"></div>
    <div class="drum">
      <div style="transform:rotateX(0deg) translateZ(433px)">Skip size?</div>
      <div style="transform:rotateX(-28deg) translateZ(433px)">Flue type?</div>
      <div style="transform:rotateX(-56deg) translateZ(433px)">Nut-free?</div>
      <div style="transform:rotateX(-84deg) translateZ(433px)">Sea view?</div>
      <div class="ph" style="transform:rotateX(-112deg) translateZ(433px)">Your question</div>
      <div style="transform:rotateX(-140deg) translateZ(433px)">Storeys?</div>
      <div style="transform:rotateX(-168deg) translateZ(433px)">Gel nails?</div>
    </div>
    <div class="shade"></div>
  </div></section>

<section class="scene s5" data-dur="4.6">
  <div class="k5"><!--logo:#17150F,#17150F--></div>
  <div class="q5"><span class="up" style="--d:0s;display:block">We build</span><span class="up" style="--d:.12s;display:block">yours.</span></div>
  <div class="tray cta up" style="--d:.5s"><div class="go">
    <b>Book a call</b><i>at nexulabs.co.uk</i>
    <div class="disc"><svg viewBox="0 0 150 150"><path d="M46 75H102M80 51L104 75L80 99" fill="none" stroke="#17150F" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div></div>
</section>
