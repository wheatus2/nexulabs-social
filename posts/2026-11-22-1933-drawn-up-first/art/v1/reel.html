<style>
/* One blueprint of a homepage unrolling towards the camera on a plaster-pink table, rendered in 3D (Blender, art/build.py;
   the print is art/print.py): blue with white line on the front, plain white on the back, so the roll is white. A pencil lies beside it.
   Each scene is one camera and twelve renders of the roll further on (r-Na.jpg to r-Nl.jpg), swapped 0.08s apart, then a slow push.
   Scene 1 wide and high, scene 2 from above, scene 3 low along the roll from its open end, scene 4 the title block with the wordmark.
   The headline sits on the bare table the roll is coming towards: Geist Bold 112px, one size and one margin (76px) in every scene. */
.scene{overflow:hidden;visibility:hidden;color:#14327C;background:#E6BFB3;
  animation:nxIn .01s linear var(--t0) both,nxOut .01s linear var(--t1) forwards,sv calc(var(--t1) - var(--t0) + .02s) linear var(--t0)}
@keyframes sv{0%,100%{visibility:visible}}
.scene.s1{opacity:1;animation:nxOut .01s linear var(--t1) forwards,sv calc(var(--t1) - var(--t0) + .02s) linear var(--t0)}
.cam{position:absolute;inset:0;animation:push var(--len) cubic-bezier(.3,0,.4,1) var(--t0) both}
@keyframes push{from{transform:scale(var(--a,1))}to{transform:scale(var(--b,1.03))}}
.pic{position:absolute;left:0;top:0;width:1080px;height:1920px;background-size:1080px 1920px}
.pic.on{opacity:0;animation:on .01s linear calc(var(--t0) + var(--at)) both}
@keyframes on{from{opacity:0}to{opacity:1}}
.h{position:absolute;left:76px;top:1270px;font-family:Geist;font-weight:700;font-size:112px;letter-spacing:-.035em;line-height:1.04;white-space:nowrap}
.s1 .cam{transform-origin:76px 1380px;--len:3.6s;--b:1.03}
.s2 .cam{transform-origin:540px 1380px;--len:3.2s;--a:1.0;--b:1.035}
.s3 .cam{transform-origin:76px 1380px;--len:3.2s;--b:1.03}
.s4 .cam{transform-origin:540px 1380px;--len:4.6s;--b:1.035}
</style>
