name: Publish to Instagram and Facebook
run-name: "${{ inputs.mode || 'comments (daily)' }}${{ inputs.folder != '' && format(': {0}', inputs.folder) || '' }}"

# Started by the Claude scheduled runs (GitHub "run workflow"), or by hand from the Actions tab.
# Talks to Meta's Graph API directly, so no Zapier tasks are used.
# Needs the repository secret META_PAGE_TOKEN (see SETUP-META.md). Never put the token in a file.

on:
  # Daily comments read (Lee, 17 Nov 2026): saves comments/latest.json so the Claude summary task
  # only has to read a file. 16:41 UTC = 16:41 GMT / 17:41 BST, before the 18:23 UK summary.
  schedule:
    - cron: "41 16 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test the token only; post = feed post or Reel; story = Instagram Story frames; comments = read recent comments (read-only); insights = last month's stats to reports/data (read-only); growth = today's followers and recent post numbers to growth/data (read-only)"
        required: true
        default: check
        type: choice
        options: [check, post, story, comments, insights, growth]
      folder:
        description: "Post folder, e.g. posts/2026-11-08-1933-first-screen-on-a-phone (not needed for check)"
        required: false
        default: ""
      platforms:
        description: "For post mode: instagram,facebook (default), instagram or facebook"
        required: false
        default: "instagram,facebook"
      month:
        description: "For insights mode: YYYY-MM (default: last calendar month)"
        required: false
        default: ""
      force:
        description: "Publish again even if published.json says it's already out"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-${{ inputs.folder || inputs.mode || 'comments' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v6

      - name: Publish
        id: pub
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          MODE: ${{ inputs.mode || 'comments' }}
          FOLDER: ${{ inputs.folder }}
          PLATFORMS: ${{ inputs.platforms }}
          FORCE: ${{ inputs.force }}
          MONTH: ${{ inputs.month }}
          # Keep retrying a failed post or Story for up to 5 hours (Lee, 10 Nov 2026). Safe: the account is checked before every try.
          RETRY_BUDGET_SECONDS: "18000"
        run: |
          set +e
          args=("$MODE")
          if [ "$MODE" = "insights" ] && [ -n "$MONTH" ]; then args+=(--month "$MONTH"); fi
          if [ "$MODE" = "post" ] || [ "$MODE" = "story" ]; then args+=("$FOLDER" --platforms "$PLATFORMS"); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python3 publish.py "${args[@]}" | tee "$RUNNER_TEMP/out.txt"
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Save published.json to the repo
        if: inputs.mode == 'post' || inputs.mode == 'story'
        env:
          FOLDER: ${{ inputs.folder }}
        run: |
          f="${FOLDER%/}/published.json"
          [ -f "$f" ] || exit 0
          git config user.name "nexulabs-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add "$f"
          git diff --cached --quiet && exit 0
          git commit -m "Published: ${FOLDER%/}"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          echo "Could not push published.json"; exit 1

      - name: Save insights to the repo
        if: inputs.mode == 'insights' || inputs.mode == 'growth'
        run: |
          mkdir -p reports/data growth/data
          git config user.name "nexulabs-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add reports/data/ growth/data/
          git diff --cached --quiet && exit 0
          git commit -m "Stats data (${{ inputs.mode }})"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          echo "Could not push insights"; exit 1

      - name: Save comments to the repo
        if: (inputs.mode || 'comments') == 'comments'
        run: |
          mkdir -p comments
          python3 - "$RUNNER_TEMP/out.txt" <<'PY'
          import json, sys, datetime, pathlib
          txt = open(sys.argv[1], encoding="utf-8").read()
          a, b = "===COMMENTS-JSON===", "===END-COMMENTS-JSON==="
          now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          if a in txt and b in txt:
              data = json.loads(txt.split(a, 1)[1].split(b, 1)[0])
          else:
              data = {"instagram": [], "facebook": [], "errors": {"run": txt.strip()[-500:] or "no output"}}
          data["fetched_at"] = now
          pathlib.Path("comments/latest.json").write_text(json.dumps(data, indent=1, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
          git config user.name "nexulabs-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add comments/latest.json
          git diff --cached --quiet && exit 0
          git commit -m "Comments read $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          echo "Could not push comments"; exit 1

      - name: Result
        run: |
          code="${{ steps.pub.outputs.code }}"
          if [ "$code" = "0" ]; then echo "All done."; exit 0; fi
          if [ "$code" = "2" ]; then echo "::warning::Instagram OK, Facebook failed (see published.json)"; exit 0; fi
          echo "::error::Publishing failed (see log above / published.json)"; exit 1
